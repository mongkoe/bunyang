<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>분양 현장 · 지역별 수수료 리포트</title>
<style>
  /* 뉴트럴은 순수 회색이 아니라 액센트(틸) 쪽으로 살짝 기울여 고른 색으로 보이게 한다.
     강조는 수수료 한 곳에만 준다 — 나머지는 조용히. */
  :root{
    --bg:#eef1f0; --paper:#ffffff; --ink:#131a1b; --muted:#5d696a; --line:#dfe6e4;
    --chip:#eaefed; --chipink:#3c4849; --accent:#0d6b5e; --accent2:#96693a;
    --hi:#0d6b5e; --card-top:#0d6b5e;
    --shadow:0 1px 2px rgba(12,28,26,.05),0 6px 18px rgba(12,28,26,.045);
    --fee:#0a5f52; --feebg:#eaf3f0; --feeline:#cfe4de;
    /* 수수료 인상 — 이 리포트에서 가장 즉각적인 신호라 유일하게 따뜻한 강조를 준다 */
    --up:#c14a35; --upbg:#fbeee9; --upline:#f0d5cb;
    --warn:#8a5a1f; --warnbg:#f6f0e5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1012; --paper:#141b1c; --ink:#e3eae9; --muted:#93a1a1; --line:#232f31;
      --chip:#1a2324; --chipink:#bfcaca; --accent:#3ec1a8; --accent2:#c9a473;
      --hi:#3ec1a8; --card-top:#3ec1a8;
      --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35);
      --fee:#5fd3bb; --feebg:#0d2a26; --feeline:#1d3f39;
      --up:#f2907a; --upbg:#2b1712; --upline:#43241c;
      --warn:#d3a55f; --warnbg:#231d11;}
  }
  :root[data-theme="light"]{ --bg:#eef1f0; --paper:#fff; --ink:#131a1b; --muted:#5d696a; --line:#dfe6e4;
    --chip:#eaefed; --chipink:#3c4849; --accent:#0d6b5e; --accent2:#96693a; --hi:#0d6b5e; --card-top:#0d6b5e;
    --shadow:0 1px 2px rgba(12,28,26,.05),0 6px 18px rgba(12,28,26,.045);
    --fee:#0a5f52; --feebg:#eaf3f0; --feeline:#cfe4de; --up:#c14a35; --upbg:#fbeee9; --upline:#f0d5cb;
    --warn:#8a5a1f; --warnbg:#f6f0e5;}
  :root[data-theme="dark"]{ --bg:#0b1012; --paper:#141b1c; --ink:#e3eae9; --muted:#93a1a1; --line:#232f31;
    --chip:#1a2324; --chipink:#bfcaca; --accent:#3ec1a8; --accent2:#c9a473; --hi:#3ec1a8; --card-top:#3ec1a8;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35);
    --fee:#5fd3bb; --feebg:#0d2a26; --feeline:#1d3f39; --up:#f2907a; --upbg:#2b1712; --upline:#43241c;
    --warn:#d3a55f; --warnbg:#231d11;}

  *{box-sizing:border-box}
  /* 글자 크기 3단계 — 모든 글자가 rem이라 이 값만 바꾸면 전체가 같은 비율로 커진다.
     상한을 125%로 잡은 근거(390px 폭 실측):
       · 레이아웃 자체는 160%까지 깨지지 않는다(전부 flex-wrap / grid auto-fill).
       · 112%가 iPhone 14/15에서 첫 화면에 검색창이 남는 한계.
       · 125%를 넘기면 카드 한 장이 화면의 80% 이상을 먹어 목록을 훑기 어려워진다. */
  html{font-size:16px}
  :root[data-fs="l"]{font-size:18px}
  :root[data-fs="xl"]{font-size:20px}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px;margin:0 auto;padding:26px 16px 64px}
  a{color:var(--accent)}
  h1{margin:0 0 5px;font-size:clamp(1.3125rem,3.2vw,1.9375rem);font-weight:800;line-height:1.14;
    letter-spacing:-.03em;word-break:keep-all;text-wrap:balance}
  .sub{color:var(--muted);font-size:0.78125rem;overflow-wrap:anywhere;opacity:.9}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .theme-btn{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:9px;
    padding:7px 11px;font:inherit;font-size:0.8125rem;cursor:pointer;white-space:nowrap}
  .theme-btn:hover{color:var(--ink)}
  /* 서명은 존재만 알리는 정도로 — 작게, 흐리게, 한 줄 */
  .topright{display:flex;align-items:center;gap:10px;flex:none}
  .byline{display:flex;align-items:baseline;gap:6px;color:var(--muted);white-space:nowrap;opacity:.85}
  .byline .by-l{font-size:0.53125rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.65}
  .byline .by-d{width:2.5px;height:2.5px;border-radius:50%;background:var(--accent);
    opacity:.5;flex:none;align-self:center}
  .byline .by-n{font-size:0.65625rem;letter-spacing:.09em;font-weight:650;color:var(--ink);opacity:.8}
  .byline .by-o{font-size:0.625rem;opacity:.7}
  /* CI — 라이트에는 컬러 로고, 다크에는 화이트 로고. 테마 토글과 OS 설정 양쪽에 반응한다. */
  /* baseline 정렬이라 로고가 라벨보다 살짝 떠 보인다 — 시각 중심을 맞추려 조금 내린다 */
  .byline .by-ci{display:inline-flex;align-items:center;line-height:0;position:relative;top:3px}
  /* 표시/숨김 규칙과 특정성을 맞춘다.
     여기에 display를 쓰면 아래 .ci-l/.ci-d 규칙을 이겨서 두 로고가 함께 보인다. */
  .byline .by-ci img{height:16px;width:auto;opacity:.9}
  .byline .by-ci .ci-l{display:block}
  .byline .by-ci .ci-d{display:none}
  @media (prefers-color-scheme: dark){
    .byline .by-ci .ci-l{display:none}
    .byline .by-ci .ci-d{display:block}
  }
  :root[data-theme="dark"] .byline .by-ci .ci-l{display:none}
  :root[data-theme="dark"] .byline .by-ci .ci-d{display:block}
  :root[data-theme="light"] .byline .by-ci .ci-l{display:block}
  :root[data-theme="light"] .byline .by-ci .ci-d{display:none}
  footer .sig{color:var(--muted);font-weight:600;letter-spacing:.06em}
  @media (max-width:560px){
    /* 좁은 화면에서도 서명·테마 버튼을 좌우로 벌리지 않고 우측에 모은다 */
    .topright{width:100%;justify-content:flex-end}
  }

  /* 개요는 기본 접힘 — 실무자는 아래 검색·필터를 먼저 쓴다.
     숫자는 접힌 줄에 그대로 남기고, 타일과 지역 막대만 펼침 안으로 넣는다. */
  .overview{margin:18px 0 12px}
  .overview>summary{list-style:none;cursor:pointer;background:var(--paper);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:11px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    font-size:0.78125rem;color:var(--muted);transition:color .12s}
  .overview>summary::-webkit-details-marker{display:none}
  .overview>summary:hover{color:var(--ink)}
  .overview>summary b{color:var(--ink);font-weight:750;font-variant-numeric:tabular-nums}
  .overview>summary .ovmore{margin-left:auto;font-size:0.6875rem;color:var(--accent);
    white-space:nowrap;font-weight:600}
  .overview[open]>summary{border-radius:12px 12px 0 0;border-bottom-color:transparent;box-shadow:none}
  .overview[open]>summary .ovmore-open{display:inline}
  .overview[open]>summary .ovmore-shut{display:none}
  .overview>summary .ovmore-open{display:none}
  .ovbody{background:var(--paper);border:1px solid var(--line);border-top:0;
    border-radius:0 0 12px 12px;box-shadow:var(--shadow);padding:4px 14px 14px}
  .ovbody .stats{margin:0 0 14px}
  .ovbody .stat{box-shadow:none;background:var(--chip);border-color:transparent}
  .ovbody .stat.lead{background:var(--feebg);border-color:var(--feeline)}
  .ovbody .distro{box-shadow:none;border:0;background:transparent;padding:0;margin:0}

  .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:20px 0 14px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
  .stat .l{color:var(--muted);font-size:0.71875rem;font-weight:600;letter-spacing:.01em}
  .stat .v{font-size:clamp(1.125rem,2.2vw,1.5rem);font-weight:750;letter-spacing:-.02em;margin-top:3px;
    font-variant-numeric:tabular-nums}
  .stat .s{color:var(--muted);font-size:0.6875rem;opacity:.85}
  .stat.lead{border-color:var(--feeline);background:var(--feebg)}
  .stat.lead .v{color:var(--fee);font-weight:800}
  .stat.lead .l{color:var(--fee);opacity:.85}

  .distro{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .distro h2{margin:0 0 11px;font-size:0.6875rem;color:var(--muted);font-weight:700;letter-spacing:.12em}
  .drow{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:0.78125rem}
  .drow .rn{width:38px;flex:none;color:var(--ink);font-weight:600}
  .drow .track{flex:1;background:var(--chip);border-radius:3px;height:9px;overflow:hidden;min-width:0}
  /* 막대는 지역색 대신 액센트 단색 — 순위는 길이와 농도로만 읽힌다 */
  .drow .fill{display:block;height:100%;min-width:3px;background:var(--accent);border-radius:3px}
  .drow .rc{width:34px;flex:none;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
  .periodbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 12px;padding:10px 12px;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .periodbar .plabel{font-size:0.625rem;font-weight:700;color:var(--muted);letter-spacing:.13em;flex:none}
  .periodbar .chips{margin:0;flex:1;min-width:0}
  .periodbar .chip{padding:5px 10px;font-size:0.78125rem}
  .pmode{flex:none}
  .pmode button{padding:6px 10px;font-size:0.75rem}
  .phint{font-size:0.6875rem;color:var(--muted);width:100%;margin-top:-2px;opacity:.85}
  .hist{margin:2px 0 10px;padding:9px 11px;background:var(--chip);border-radius:10px}
  .hist .hl{font-size:0.625rem;color:var(--muted);font-weight:700;letter-spacing:.13em}
  .hist .hv{font-size:0.8125rem;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .hist .hv .ago{font-weight:500;color:var(--muted);font-size:0.6875rem;margin-left:5px}
  .spark{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
  .spark i{font-style:normal;font-size:0.625rem;background:var(--paper);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .spark i.f{background:var(--accent);border-color:transparent;font-weight:700}
  .badge.new{background:var(--accent2);border-color:transparent}
  .chip{border:1px solid var(--line);background:var(--paper);color:var(--chipink);border-radius:999px;
    padding:6px 12px;font-size:0.8125rem;cursor:pointer;user-select:none;white-space:nowrap;transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--hi);color:#fff;border-color:var(--hi)}
  .chip .n{opacity:.72;font-variant-numeric:tabular-nums;margin-left:3px}
  /* 액센트를 배경으로 깔 때 글자색.
     다크에서는 액센트가 밝은 민트라 흰 글씨가 묻힌다 — 어두운 글자로 뒤집는다.
     (이전 버전은 셀렉터와 @media를 콤마로 이어 붙여 규칙 전체가 무시되고 있었다) */
  .chip.on,.seg button.on,.spark i.f,.badge.new,.lockgo{color:#fff}
  @media (prefers-color-scheme: dark){
    .chip.on,.seg button.on,.spark i.f,.badge.new,.lockgo{color:#08211d}
  }
  :root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .seg button.on,
  :root[data-theme="dark"] .spark i.f,:root[data-theme="dark"] .badge.new,
  :root[data-theme="dark"] .lockgo{color:#08211d}
  :root[data-theme="light"] .chip.on,:root[data-theme="light"] .seg button.on,
  :root[data-theme="light"] .spark i.f,:root[data-theme="light"] .badge.new,
  :root[data-theme="light"] .lockgo{color:#fff}

  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
  .toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:9px;padding:9px 11px;font:inherit;font-size:0.875rem}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .toolbar select{cursor:pointer}
  .tog{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:0.8125rem;cursor:pointer;user-select:none;
    border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 11px}
  .tog input{accent-color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:var(--paper);color:var(--muted);padding:8px 12px;font:inherit;font-size:0.8125rem;cursor:pointer}
  .seg button.on{background:var(--hi);color:#fff}
  .count{color:var(--muted);font-size:0.8125rem;margin:2px 2px 12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  /* 카드는 조용하게 — 지역색은 배지에만 남기고 상단 색띠는 걷어냈다 */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:15px 16px 13px;display:flex;flex-direction:column;min-width:0;transition:border-color .12s}
  .card:hover{border-color:var(--feeline)}
  .card h3{margin:0 0 7px;font-size:1.03125rem;font-weight:750;letter-spacing:-.015em;line-height:1.3;
    word-break:keep-all;text-wrap:balance}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;align-items:center}
  /* nowrap이 없으면 표의 좁은 첫 칸에서 "서/울"처럼 글자가 세로로 쪼개진다 */
  .badge{font-size:0.6875rem;border-radius:5px;padding:2px 7px;font-weight:600;background:var(--chip);
    color:var(--chipink);white-space:nowrap;display:inline-block}
  /* 지역은 면을 채우지 않고 윤곽선으로 — 카드가 71장 깔려도 시끄럽지 않게 */
  .badge.reg{background:transparent;border:1px solid currentColor;font-weight:700;opacity:.9}
  .loc{color:var(--muted);font-size:0.78125rem;margin:-3px 0 11px;overflow-wrap:anywhere}
  .loc b{color:var(--ink);font-weight:600}

  /* 이 리포트를 보는 이유 — 시각적 무게는 여기 한 곳에만 준다 */
  .fee{background:var(--feebg);border:1px solid var(--feeline);border-radius:11px;padding:11px 13px;margin-bottom:11px}
  .fee .fl{font-size:0.625rem;color:var(--fee);font-weight:700;letter-spacing:.14em;opacity:.8}
  .fee .fv{font-size:1.3125rem;font-weight:800;color:var(--fee);letter-spacing:-.025em;line-height:1.2;
    margin:3px 0 1px;word-break:keep-all;font-variant-numeric:tabular-nums}
  .fee.na{background:transparent;border-style:dashed;border-color:var(--line)}
  .fee.na .fl{color:var(--muted)}
  .fee.na .fv{color:var(--muted);font-size:0.875rem;font-weight:600}
  .fchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .fchip{font-size:0.71875rem;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--chipink)}
  .fchip.up{background:var(--upbg);color:var(--up);border-color:var(--upline);font-weight:700}
  /* 인상된 현장은 수수료 블록 왼쪽에 얇은 띠 하나로 표시 — 카드를 훑을 때 걸리도록 */
  .fee.up{border-left:3px solid var(--up)}
  .t-up{color:var(--up);font-weight:700;white-space:nowrap}

  .kv{font-size:0.78125rem;margin:0 0 9px;overflow-wrap:anywhere}
  .kv .k{color:var(--muted);font-weight:700;margin-right:5px}
  .btags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .btag{font-size:0.71875rem;background:var(--chip);color:var(--chipink);border-radius:999px;padding:3px 9px}
  .foot{margin-top:auto;border-top:1px dashed var(--line);padding-top:9px;font-size:0.75rem;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  details{margin-top:8px}
  details>summary{cursor:pointer;color:var(--accent);font-size:0.78125rem;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸ ";}
  details[open]>summary::before{content:"▾ ";}
  .ev{margin-top:8px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
  .ev .m{font-size:0.71875rem;white-space:pre-wrap;word-break:break-word;color:var(--ink);background:var(--chip);
    border-radius:8px;padding:8px 10px;margin:6px 0}
  .ev .mi{color:var(--muted);font-size:0.65625rem}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:1050px}
  th,td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:left;font-size:0.78125rem;vertical-align:top}
  th{background:var(--chip);position:sticky;top:0;color:var(--chipink);white-space:nowrap;z-index:1}
  td .nm{font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:0.875rem}
  .hidden{display:none!important}
  footer{margin-top:38px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:0.6875rem;text-align:center;overflow-wrap:anywhere;line-height:1.7;opacity:.9}

  @media (max-width:900px){ .stats{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .toolbar input[type=search]{min-width:100%}
    /* 좁은 화면에서 기간 줄은 가로로 밀어넣지 않고 세로로 쌓는다.
       (칩이 여러 줄로 접히면 옆에 붙은 모드 버튼이 어긋나 보인다) */
    .periodbar{flex-direction:column;align-items:stretch;gap:8px}
    .periodbar .chips{flex:none}
    .pmode{align-self:flex-start}
    .phint{margin-top:0}
    .lockbar .lockform{flex:1}
    .lockbar input{flex:1;width:auto;min-width:0}
  }

  .lockbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 12px;padding:10px 13px;
    background:var(--warnbg);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:10px}
  .lockbar.open{background:var(--feebg);border-left-color:var(--accent)}
  .lockbar .lockmsg{font-size:0.75rem;color:var(--ink);flex:1;min-width:200px;opacity:.9}
  .lockbar .lockform{display:flex;gap:7px;flex:none}

  const tiles = [
    ["추출 현장", (META.num_sites||DATA.length).toLocaleString(), "중복 공고 병합", true],
    ["지역(시도)", META.num_regions||"", "미확인 포함", false],
    ["수수료 확인", META.num_fee_known||"", "현장 기준", false],
    ["분양가 확인", META.num_price_known||"", "현장 기준", false],
    ["조직구인공고", (c.candidate||0).toLocaleString(), "광고·잡담 제외", false],
    ["전체 메시지", (META.total_messages||0).toLocaleString(), `광고 ${c.ad||0}·미디어 ${c.media||0} 제외`, false],
  ];
  document.getElementById("stats").innerHTML = tiles.map(t=>
    `<div class="stat${t[3]?" lead":""}"><div class="l">${t[0]}</div><div class="v">${t[1]}</div><div class="s">${esc(t[2])}</div></div>`).join("");

  // 접힌 줄에 들어갈 한 줄 요약 — 펼치지 않아도 규모를 알 수 있게
  document.getElementById("ovsum").innerHTML =
    `현장 <b>${(META.num_sites||DATA.length).toLocaleString()}</b>`
  + ` · 지역 <b>${META.num_regions||""}</b>`
  + ` · 수수료 확인 <b>${META.num_fee_known||""}</b>`
  + ` · 분양가 <b>${META.num_price_known||""}</b>`
  + `<span class="ovmore"><span class="ovmore-shut">지역별 분포 ▾</span>`
  + `<span class="ovmore-open">접기 ▴</span></span>`;

  // 지역 분포 막대
  const counts = regionCounts();
  const max = Math.max(1,...Object.values(counts));
  const rows = orderedRegions(counts).map(r=>{
    const n=counts[r];
    // 상위일수록 진하게 — 색상 대신 농도로 순위를 표현한다
    const op = (0.35 + 0.65 * (n/max)).toFixed(2);
    return `<div class="drow"><span class="rn">${esc(r)}</span><span class="track"><span class="fill" style="width:${(n/max*100).toFixed(1)}%;opacity:${op}"></span></span><span class="rc">${n}</span></div>`;
  }).join("");
  document.getElementById("distro").innerHTML = `<h2>지역별 현장 수</h2>${rows}`;
}
function regionCounts(){ const c={}; DATA.forEach(s=>c[s.region]=(c[s.region]||0)+1); return c; }
function orderedRegions(counts){
  const known = REGION_ORDER.filter(r=>counts[r]).sort((a,b)=>counts[b]-counts[a]);
  if(counts["미확인"]) known.push("미확인");
  return known;
}

/* ---- 칩 ---- */
function initChips(){
  const counts = regionCounts();
  const chips = [`<span class="chip ${state.region===""?"on":""}" data-r="">전체<span class="n">${DATA.length}</span></span>`];
  orderedRegions(counts).forEach(r=>{
    const col = state.region===r ? `style="--hi:${REGION_COLOR[r]||'var(--accent)'}"` : "";
    chips.push(`<span class="chip ${state.region===r?"on":""}" data-r="${esc(r)}" ${col}>${esc(r)}<span class="n">${counts[r]}</span></span>`);
  });
  const box = document.getElementById("chips");
  box.innerHTML = chips.join("");
  box.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{ state.region=el.dataset.r; initChips(); initPeriodChips(); render(); });
}

/* ---- 기간 칩 ----
   개수는 "현재 지역 필터가 적용된 상태"에서 세어, 지역과 기간을 겹쳐 볼 수 있게 한다. */
function initPeriodChips(){
  const base = DATA.filter(s => !state.region || s.region === state.region);
  const keys = ["", "d7", "d30"].concat(MONTHS);
  const html = keys.map(k=>{
    const n = k === "" ? base.length : base.filter(s=>inPeriod(s,k,state.pmode)).length;
    return `<span class="chip ${state.period===k?"on":""}" data-p="${esc(k)}">${esc(periodLabel(k))}<span class="n">${n}</span></span>`;
  }).join("");
  const box = document.getElementById("periodChips");
  box.innerHTML = html;
  box.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{ state.period=el.dataset.p; initPeriodChips(); render(); });
  document.getElementById("phint").textContent =
    state.pmode === "new"
      ? `모집시작 기준 : 해당 기간 처음 조직구인 공고가 올라온 현장만 집계 (기준일 ${AS_OF})`
      : `공고활동 기준 : 해당 기간 조직구인 공고가 올라온 현장 집계 (과거 시작 현장 포함, 기준일 ${AS_OF})`;
}

/* ---- 수수료 표시 ---- */
function feeHeadline(s){
  const f=s.fee;
  if(!f) return {big:"수수료 미확인", na:true};
  if(f.team_total) return {big:f.team_total, na:false};
  if(f.team_leader||f.team_member){
    const p=[]; if(f.team_leader)p.push("팀장 "+f.team_leader); if(f.team_member)p.push("팀원 "+f.team_member);
    return {big:p.join(" · "), na:false};
  }
  if(f.raised) return {big:"수수료 인상 (유선문의)", na:false};
  if(f.ad_support||f.prepaid||f.daily||f.cycle) return {big:"유선문의 (조건 명시)", na:false};
  return {big:"유선문의", na:false};
}
function feeChips(f){
  if(!f) return "";
  const out=[];
  if(f.raised) out.push(`<span class="fchip up">▲ 수수료 인상</span>`);
  if(f.team_total && (f.team_leader||f.team_member)){
    const p=[]; if(f.team_leader)p.push("팀장 "+f.team_leader); if(f.team_member)p.push("팀원 "+f.team_member);
    out.push(`<span class="fchip">${esc(p.join(" / "))}</span>`);
  }
  if(f.prepaid) out.push(`<span class="fchip">선지급 ${esc(f.prepaid)}</span>`);
  if(f.ad_support) out.push(`<span class="fchip">광고비 ${esc(f.ad_support)}</span>`);
  if(f.daily) out.push(`<span class="fchip">일비 ${esc(f.daily)}</span>`);
  if(f.cycle) out.push(`<span class="fchip">지급 ${esc(f.cycle)}</span>`);
  return out.join("");
}

/* ---- 필터/정렬 ---- */
function filtered(){
  let r = DATA.filter(s=>{
    if(state.region && s.region!==state.region) return false;
    if(state.feeOnly && !s.fee_known) return false;
    if(state.period && !inPeriod(s, state.period, state.pmode)) return false;
    if(state.q){
      const hay=[s.name,s.sigungu,s.address,s.price,(s.benefits||[]).join(" "),(s.fee&&s.fee.raw)||"",(s.type||[]).join(" ")].join(" ").toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  const ri = r0=>{const i=REGION_ORDER.indexOf(r0);return i<0?98:i;};
  r.sort((a,b)=>{
    if(state.sort==="fee") return (b.fee_man||-1)-(a.fee_man||-1) || (b.last_seen||"").localeCompare(a.last_seen||"");
    if(state.sort==="recent") return (b.last_seen||"").localeCompare(a.last_seen||"");
    if(state.sort==="newest") return (b.first_day||b.first_seen||"").localeCompare(a.first_day||a.first_seen||"");
    if(state.sort==="count") return (b.count||0)-(a.count||0);
    if(state.sort==="region") return ri(a.region)-ri(b.region) || (a.name||"").localeCompare(b.name||"","ko");
    return 0;
  });
  return r;
}

/* ---- 모집 이력 ---- */
function daysBetween(a,b){
  const d1=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  if(isNaN(d1)||isNaN(d2)) return null;
  return Math.round((d2-d1)/86400000);
}
/* 기준일로부터 14일 이내에 시작했으면 신규로 본다 */
function isNew(s){
  const f=s.first_day||(s.first_seen||"").slice(0,10);
  const g=daysBetween(f, AS_OF);
  return g!==null && g<=14;
}
function histBlock(s){
  const f=s.first_day||(s.first_seen||"").slice(0,10);
  const l=s.last_day||(s.last_seen||"").slice(0,10);
  if(!f) return "";
  const gap=daysBetween(f, AS_OF);
  const ago = gap===null ? "" : (gap===0 ? "기준일 당일" : `${gap}일 전 시작`);
  const ds=s.dates||[];
  let spark="";
  if(ds.length){
    const show=ds.slice(0,14);
    spark=`<div class="spark">${show.map((d,i)=>`<i class="${i===0?"f":""}">${esc(d.slice(5))}</i>`).join("")}`
        + (ds.length>show.length?`<i>외 ${ds.length-show.length}회</i>`:"") + `</div>`;
  }
  const again = ds.length>1 ? ` · 이후 ${ds.length-1}회 재공고 (최근 ${esc(l)})` : " · 재공고 없음";
  return `<div class="hist">
    <div class="hl">최초 모집 시작</div>
    <div class="hv">${esc(f)}<span class="ago">${esc(ago)}${again}</span></div>
    ${spark}
  </div>`;
}

/* ---- 렌더 ---- */
function card(s){
  const fh=feeHeadline(s);
  const regcol=REGION_COLOR[s.region]||"var(--muted)";
  const types=(s.type||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")
    + (isNew(s)?`<span class="badge new">신규</span>`:"");
  const bens=(s.benefits||[]).slice(0,7).map(b=>`<span class="btag">${esc(b)}</span>`).join("");
  const ev=(s.evidence_text||[]).map(e=>`<div class="mi">#${e.i}</div><div class="m">${esc(e.t)}</div>`).join("");
  const detail = `
    ${s.recruit?`<div class="kv"><span class="k">모집</span>${esc(s.recruit)}</div>`:""}
    ${s.contact?`<div class="kv"><span class="k">연락처</span>${esc(s.contact)}</div>`:""}
    ${s.promo_center?`<div class="kv"><span class="k">홍보관</span>${esc(s.promo_center)}</div>`:""}
    ${s.fee&&s.fee.raw?`<div class="kv"><span class="k">수수료 원문</span>${esc(s.fee.raw)}</div>`:""}
    ${ev?`<div class="ev">${ev}</div>`:""}`;
  return `<div class="card">
    <div class="badges"><span class="badge reg" style="color:${regcol}">${esc(s.region)}</span>${types}</div>
    <h3>${esc(s.name)}</h3>
    <div class="loc">${s.sigungu?`<b>${esc(s.sigungu)}</b>`:""}${s.address&&s.address!==s.sigungu?` · ${esc(s.address)}`:""}</div>
    <div class="fee ${fh.na?"na":""}${s.fee&&s.fee.raised?" up":""}"><div class="fl">수수료</div><div class="fv">${esc(fh.big)}</div><div class="fchips">${feeChips(s.fee)}</div></div>
    ${histBlock(s)}
    ${s.price?`<div class="kv"><span class="k">분양가</span>${esc(s.price)}</div>`:""}
    ${bens?`<div class="btags">${bens}</div>`:""}
    <div class="foot"><span>구인공고 ${s.count}회 · ${esc((s.first_seen||"").slice(5,10))}~${esc((s.last_seen||"").slice(5,10))}</span></div>
    <details><summary>상세 · 구인공고 원문</summary>${detail}</details>
  </div>`;
}

function tableView(rows){
  const head=`<tr><th>지역</th><th>현장명</th><th>시군구</th><th>유형</th><th>수수료</th><th>분양가</th><th>모집</th><th>연락처</th><th>구인공고</th><th>최초 시작</th><th>최근 공고</th></tr>`;
  const body=rows.map(s=>{
    const fh=feeHeadline(s);
    return `<tr>
      <td><span class="badge reg" style="color:${REGION_COLOR[s.region]||'var(--muted)'}">${esc(s.region)}</span></td>
      <td><span class="nm">${esc(s.name)}</span>${isNew(s)?` <span class="badge new">신규</span>`:""}</td>
      <td>${esc(s.sigungu||"")}</td>
      <td>${esc((s.type||[]).join(", "))}</td>
      <td>${s.fee&&s.fee.raised?`<span class="t-up">▲ </span>`:""}${esc(fh.big)}${s.fee&&s.fee.ad_support?`<br><small>광고비 ${esc(s.fee.ad_support)}</small>`:""}</td>
      <td>${esc(s.price||"")}</td>
      <td>${esc(s.recruit||"")}</td>
      <td>${esc(s.contact||"")}</td>
      <td>${s.count}</td>
      <td>${esc(s.first_day||(s.first_seen||"").slice(0,10))}</td>
      <td>${esc(s.last_day||(s.last_seen||"").slice(0,10))}</td>
    </tr>`;
  }).join("");
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function render(){
  const rows=filtered();
  document.getElementById("count").textContent =
    `${rows.length}개 현장${state.region?` · ${state.region}`:""}`
    + `${state.period?` · ${periodLabel(state.period)} ${state.pmode==="new"?"모집 시작":"공고 활동"}`:""}`
    + `${state.q?` · "${state.q}"`:""}${state.feeOnly?" · 수수료 확인만":""}`;
  const cards=document.getElementById("cards"), table=document.getElementById("table"), empty=document.getElementById("empty");
  empty.classList.toggle("hidden", rows.length>0);
  if(state.view==="card"){
    cards.classList.remove("hidden"); table.classList.add("hidden");
    cards.innerHTML=rows.map(card).join("");
  }else{
    cards.classList.add("hidden"); table.classList.remove("hidden");
    table.innerHTML=tableView(rows);
  }
}

/* ---- 이벤트 ---- */
function initEvents(){
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
  document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});
  document.getElementById("feeOnly").addEventListener("change",e=>{state.feeOnly=e.target.checked;render();});
  const mn=document.getElementById("mNew"), ma=document.getElementById("mAct");
  mn.onclick=()=>{state.pmode="new";mn.classList.add("on");ma.classList.remove("on");initPeriodChips();render();};
  ma.onclick=()=>{state.pmode="act";ma.classList.add("on");mn.classList.remove("on");initPeriodChips();render();};
  const vc=document.getElementById("vCard"), vt=document.getElementById("vTable");
  vc.onclick=()=>{state.view="card";vc.classList.add("on");vt.classList.remove("on");render();};
  vt.onclick=()=>{state.view="table";vt.classList.add("on");vc.classList.remove("on");render();};
  // 글자 크기 — 보통 → 크게 → 아주 크게 순환. 선택은 브라우저에 기억시킨다.
  const fb=document.getElementById("fsBtn");
  const FS=["","l","xl"], FSL={"":"가 보통","l":"가 크게","xl":"가 아주 크게"};
  let fi=0;
  function applyFs(){
    const v=FS[fi];
    if(v) document.documentElement.setAttribute("data-fs",v);
    else document.documentElement.removeAttribute("data-fs");
    fb.textContent=FSL[v];
    try{ localStorage.setItem("bunyang-fs", v); }catch(e){}
  }
  try{
    const saved=localStorage.getItem("bunyang-fs");
    if(saved!==null && FS.indexOf(saved)>-1){ fi=FS.indexOf(saved); applyFs(); }
  }catch(e){}
  fb.onclick=()=>{ fi=(fi+1)%FS.length; applyFs(); };

  // 테마
  const tb=document.getElementById("themeBtn");
  const modes=["auto","light","dark"], lbl={auto:"◐ 자동",light:"☀ 라이트",dark:"☾ 다크"};
  let mi=0;
  tb.onclick=()=>{mi=(mi+1)%3;const m=modes[mi];
    if(m==="auto")document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",m);
    tb.textContent=lbl[m];};
}

      render();
      bar.classList.add("open");
      msg.textContent = "연락처가 표시됩니다. 페이지를 새로 고치면 다시 가려집니다.";
      document.getElementById("lockForm").style.display = "none";
    }catch(e){
      msg.textContent = "암호가 맞지 않습니다.";
      btn.disabled = false;
    }
  }
  btn.onclick = unlock;
  pw.addEventListener("keydown", e=>{ if(e.key==="Enter") unlock(); });
})();

initHeader(); initChips(); initPeriodChips(); initEvents(); render();
document.getElementById("footer").innerHTML =
  ((PAYLOAD.credit && (PAYLOAD.credit.org || PAYLOAD.credit.name))
    ? `<span class="sig">${[PAYLOAD.credit.label, PAYLOAD.credit.org,
        [PAYLOAD.credit.name, PAYLOAD.credit.title].filter(Boolean).join(" ")]
        .filter(Boolean).map(esc).join(" ")}</span><br>`
    : "")
  + `현장 ${DATA.length}개 · 생성 2026-08-19 16:50<br>※ 수수료·조건은 조직구인공고 원문 기준이며 실제와 다를 수 있습니다. 계약 전 각 현장에 직접 확인하세요.`;
</script>
</body>
